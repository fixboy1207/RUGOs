<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6F4E37">
<title>BREW CAFÉ POS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#f5f5f5}
button{cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:active{opacity:.65}
input,select{outline:none;font-family:inherit;-webkit-appearance:none}
input:focus,select:focus{border-color:#6F4E37!important}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:8px}
.tag{display:inline-block;border-radius:20px;font-size:10px;padding:2px 8px;font-weight:700}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:#f5f5f5;overflow:hidden}
#cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div id="app">
  <div id="nav"></div>
  <div id="cnt"></div>
</div>
<script>
var DMENU=[
  {id:'A1',name:'美式咖啡',price:90,cat:'drinks',ic:'☕',active:true},
  {id:'A2',name:'拿鐵',price:115,cat:'drinks',ic:'🥛',active:true},
  {id:'A3',name:'卡布奇諾',price:120,cat:'drinks',ic:'☕',active:true},
  {id:'A4',name:'摩卡',price:135,cat:'drinks',ic:'🍫',active:true},
  {id:'A5',name:'抹茶拿鐵',price:130,cat:'drinks',ic:'🍵',active:true},
  {id:'A6',name:'焦糖瑪奇朵',price:140,cat:'drinks',ic:'🍮',active:true},
  {id:'A7',name:'阿芙佳朵',price:155,cat:'drinks',ic:'🍨',active:true},
  {id:'A8',name:'紅茶',price:70,cat:'drinks',ic:'🫖',active:true},
  {id:'B1',name:'法式吐司',price:155,cat:'food',ic:'🍞',active:true},
  {id:'B2',name:'凱薩沙拉',price:185,cat:'food',ic:'🥗',active:true},
  {id:'B3',name:'燻雞帕尼尼',price:200,cat:'food',ic:'🥪',active:true},
  {id:'B4',name:'歐式早午餐',price:285,cat:'food',ic:'🍳',active:true},
  {id:'C1',name:'提拉米蘇',price:125,cat:'dessert',ic:'🍰',active:true},
  {id:'C2',name:'起司蛋糕',price:135,cat:'dessert',ic:'🎂',active:true},
  {id:'C3',name:'奶油可頌',price:68,cat:'dessert',ic:'🥐',active:true},
  {id:'C4',name:'馬卡龍3入',price:115,cat:'dessert',ic:'🍬',active:true},
];
var DEF_STAFF=[{id:'S1',name:'店長'},{id:'S2',name:'員工A'},{id:'S3',name:'員工B'}];
var CATBG={drinks:'#FFF3E0',food:'#FFF8E1',dessert:'#EDE7F6'};
var CATBD={drinks:'#FFCC80',food:'#FFE082',dessert:'#CE93D8'};
var STMAP={pending:{lb:'待處理',bg:'#FFF3E0',col:'#BF360C'},making:{lb:'製作中',bg:'#E3F2FD',col:'#1565C0'},done:{lb:'已完成',bg:'#E8F5E9',col:'#2E7D32'},cancelled:{lb:'已取消',bg:'#f5f5f5',col:'#999'}};
var PAYLB={cash:'現金',card:'信用卡',linepay:'LINE Pay'};
var ICLIST=['☕','🥛','🍫','🍵','🍮','🍨','🫖','🍞','🥗','🥪','🍳','🍝','🍰','🎂','🥐','🍬','🧁','🍩','🧋','🥤'];

var S={
  view:'pos',sub:'menu',pinOk:false,pinBuf:'',pinErr:false,
  cat:'all',otype:'dine',table:'',pay:'cash',cashIn:'',
  cart:{},curOrder:null,curTab:'receipt',
  orders:[],no:1,menu:[],inv:{},
  members:[],curMember:null,staff:[],curStaff:null,
  search:'',discount:0,carrier:'',openCash:0,
  cfg:{shop:'BREW CAFÉ',cur:'NT$',tax:0,note:'感謝光臨，歡迎再來！',pin:'1234'},
  addForm:false,editId:null,restockId:null,mPhone:'',
};

(function(){
  try{
    var m=localStorage.getItem('bpa_m'),o=localStorage.getItem('bpa_o'),n=localStorage.getItem('bpa_n'),
        v=localStorage.getItem('bpa_v'),c=localStorage.getItem('bpa_c'),
        mb=localStorage.getItem('bpa_mb'),sf=localStorage.getItem('bpa_sf');
    S.menu=m?JSON.parse(m):JSON.parse(JSON.stringify(DMENU));
    if(o)S.orders=JSON.parse(o);if(n)S.no=+n;if(v)S.inv=JSON.parse(v);
    if(c)S.cfg=Object.assign(S.cfg,JSON.parse(c));
    if(mb)S.members=JSON.parse(mb);
    S.staff=sf?JSON.parse(sf):JSON.parse(JSON.stringify(DEF_STAFF));
  }catch(e){S.menu=JSON.parse(JSON.stringify(DMENU));S.staff=JSON.parse(JSON.stringify(DEF_STAFF));}
  S.menu.forEach(function(m){if(!S.inv[m.id])S.inv[m.id]={stock:50,unlimited:true,minAlert:5,log:[]};});
  S.curStaff=S.staff[0]||null;
})();

function persist(){
  try{
    localStorage.setItem('bpa_m',JSON.stringify(S.menu));localStorage.setItem('bpa_o',JSON.stringify(S.orders));
    localStorage.setItem('bpa_n',S.no);localStorage.setItem('bpa_v',JSON.stringify(S.inv));
    localStorage.setItem('bpa_c',JSON.stringify(S.cfg));localStorage.setItem('bpa_mb',JSON.stringify(S.members));
    localStorage.setItem('bpa_sf',JSON.stringify(S.staff));
  }catch(e){}
}

function tod(){return new Date().toLocaleDateString('zh-TW')}
function tnow(){return new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function p3(n){return String(n).padStart(3,'0')}
function cur(){return S.cfg.cur}
function cSub(){return Object.values(S.cart).reduce(function(s,c){return s+c.price*c.qty},0)}
function cCount(){return Object.values(S.cart).reduce(function(s,c){return s+c.qty},0)}
function actMenu(){return S.menu.filter(function(m){return m.active})}
function invOf(id){if(!S.inv[id])S.inv[id]={stock:50,unlimited:true,minAlert:5,log:[]};return S.inv[id]}
function isOut(id){var v=invOf(id);return !v.unlimited&&v.stock<=0}
function isLow(id){var v=invOf(id);return !v.unlimited&&v.stock>0&&v.stock<=v.minAlert}
function lowCount(){return S.menu.filter(function(m){return isLow(m.id)||isOut(m.id)}).length}
function todayOrds(){return S.orders.filter(function(o){return o.date===tod()})}
function mLv(spend){
  if(spend>=30000)return{lb:'⭐ VIP',col:'#B45309',bg:'#FEF3C7',disc:10,next:null};
  if(spend>=10000)return{lb:'🥇 金卡',col:'#D97706',bg:'#FFFBEB',disc:5,next:'VIP (NT$30,000)'};
  if(spend>=3000)return{lb:'🥈 銀卡',col:'#6B7280',bg:'#F3F4F6',disc:3,next:'金卡 (NT$10,000)'};
  return{lb:'👤 一般',col:'#9CA3AF',bg:'#F9FAFB',disc:0,next:'銀卡 (NT$3,000)'};
}
function mDiscAmt(sub){if(!S.curMember)return 0;return Math.floor(sub*mLv(S.curMember.spend).disc/100)}
function calcGrand(){
  var sub=cSub(),mDisc=mDiscAmt(sub),manDisc=parseInt(S.discount)||0;
  var after=Math.max(0,sub-mDisc-manDisc),tax=Math.round(after*S.cfg.tax/100);
  return{sub:sub,mDisc:mDisc,manDisc:manDisc,after:after,tax:tax,grand:after+tax};
}
function findMember(phone){return S.members.find(function(m){return m.phone===phone})}
function quickAmts(grand){
  var s=new Set([grand]);
  var r50=Math.ceil(grand/50)*50,r100=Math.ceil(grand/100)*100,r500=Math.ceil(grand/500)*500,r1000=Math.ceil(grand/1000)*1000;
  if(r50>grand)s.add(r50);if(r100>grand)s.add(r100);
  if(r500>grand&&r500<=2000)s.add(r500);if(r1000>grand&&r1000<=5000)s.add(r1000);
  return Array.from(s).sort(function(a,b){return a-b}).slice(0,5);
}
function toast(msg,col){
  col=col||'#4CAF50';var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:'+col+';color:#fff;padding:10px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.25);';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
}

// ── RENDER ─────────────────────────────────────────────────────────────
function render(){
  renderNav();var c=document.getElementById('cnt');if(!c)return;
  switch(S.view){
    case'pos':c.innerHTML=posView();break;
    case'checkout':c.innerHTML=checkoutView();break;
    case'member':c.innerHTML=memberView();break;
    case'print':c.innerHTML=printView();break;
    case'orders':c.innerHTML=ordersView();break;
    case'pin':c.innerHTML=pinView();break;
    case'admin':c.innerHTML=adminView();break;
  }
  if(c)c.scrollTop=0;
}

function renderNav(){
  var lc=lowCount(),toOrd=todayOrds().length;
  document.getElementById('nav').innerHTML=
    '<div style="background:#6F4E37;padding:11px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0">'
    +'<span style="color:#fff;font-size:15px;font-weight:700;margin-right:6px">☕ '+S.cfg.shop+'</span>'
    +[['pos','🧾 收銀'],['orders','📋 訂單'+(toOrd?'('+toOrd+')':'')],['pin','⚙️ 後台']].map(function(v){
      var on=(v[0]==='pos'&&['pos','checkout','member','print'].includes(S.view))
           ||(v[0]==='orders'&&S.view==='orders')
           ||(v[0]==='pin'&&['pin','admin'].includes(S.view));
      return '<button onclick="gotoView(\''+v[0]+'\')" style="background:'+(on?'rgba(255,255,255,.35)':'transparent')+';color:'+(on?'#fff':'rgba(255,255,255,.7)')+';padding:6px 12px;border-radius:20px;font-size:13px">'+v[1]+'</button>';
    }).join('')
    +(lc?'<button onclick="gotoAdmin(\'inv\')" style="background:#e53935;color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;font-weight:700">⚠️ '+lc+'項</button>':'')
    +(S.curStaff?'<span style="margin-left:auto;color:rgba(255,255,255,.7);font-size:12px">👤 '+S.curStaff.name+'</span>':'')
    +'</div>';
}

// ── POS ─────────────────────────────────────────────────────────────────
function posView(){
  var G=calcGrand(),count=cCount();
  var filtMenu=actMenu().filter(function(m){
    if(S.cat!=='all'&&m.cat!==S.cat)return false;
    if(S.search&&m.name.indexOf(S.search)<0)return false;
    return true;
  });
  var grid=filtMenu.map(function(item){
    var out=isOut(item.id),low=isLow(item.id),inv=invOf(item.id);
    return '<button onclick="addItem(\''+item.id+'\',\''+item.name+'\','+item.price+',\''+item.ic+'\')" '+(out?'disabled':'')+' style="background:'+(out?'#f5f5f5':CATBG[item.cat]||'#f9f9f9')+';border:1px solid '+(out?'#ddd':CATBD[item.cat]||'#ddd')+';border-radius:10px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:'+(out?.5:1)+'">'
      +'<span style="font-size:24px">'+item.ic+'</span>'
      +'<span style="font-size:12px;font-weight:600;color:#333;text-align:center;line-height:1.3">'+item.name+'</span>'
      +'<span style="font-size:12px;color:#6F4E37;font-weight:700">'+cur()+item.price+'</span>'
      +(out?'<span style="font-size:9px;color:#fff;background:#e53935;border-radius:3px;padding:1px 5px">缺貨</span>':low?'<span style="font-size:9px;color:#E65100">剩'+inv.stock+'</span>':'')
      +'</button>';
  }).join('');
  var cartRows=!Object.values(S.cart).length
    ?'<div style="text-align:center;color:#ccc;padding:14px 0;font-size:13px">🛒 尚未選購</div>'
    :Object.values(S.cart).map(function(i){
      return '<div style="display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #f5f5f5">'
        +'<span style="font-size:18px">'+i.ic+'</span>'
        +'<span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+i.name+'</span>'
        +'<button onclick="adjCart(\''+i.id+'\',-1)" style="background:#f0f0f0;border:1px solid #ddd;border-radius:6px;width:28px;height:28px;font-size:16px;line-height:1">−</button>'
        +'<span style="font-size:14px;width:20px;text-align:center;font-weight:600">'+i.qty+'</span>'
        +'<button onclick="adjCart(\''+i.id+'\',1)" style="background:#6F4E37;color:#fff;border-radius:6px;width:28px;height:28px;font-size:16px;line-height:1">+</button>'
        +'<span style="font-size:13px;color:#6F4E37;font-weight:700;width:54px;text-align:right">'+cur()+i.price*i.qty+'</span>'
        +'</div>';
    }).join('');
  var mBadge=S.curMember
    ?'<div style="background:'+mLv(S.curMember.spend).bg+';border:1px solid '+mLv(S.curMember.spend).col+';border-radius:8px;padding:6px 11px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'
      +'<span style="font-size:13px"><span class="tag" style="background:'+mLv(S.curMember.spend).col+';color:#fff">'+mLv(S.curMember.spend).lb+'</span>　'+S.curMember.name+'　-'+mLv(S.curMember.spend).disc+'%</span>'
      +'<button onclick="clearMember()" style="background:transparent;color:#aaa;font-size:18px;padding:0 4px">✕</button></div>'
    :'';
  return '<div>'
    +'<div style="background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 12px">'
    +'<input placeholder="🔍 搜尋商品" value="'+S.search+'" oninput="setSearch(this.value)" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:9px;font-size:14px;margin-bottom:7px">'
    +'<div style="display:flex;gap:5px;overflow-x:auto">'
    +[['all','全部'],['drinks','☕ 飲料'],['food','🍽 餐點'],['dessert','🍰 甜點']].map(function(c){
      return '<button onclick="setCat(\''+c[0]+'\')" style="padding:6px 14px;background:'+(S.cat===c[0]?'#6F4E37':'#f0f0f0')+';color:'+(S.cat===c[0]?'#fff':'#555')+';border:none;border-radius:20px;font-size:13px;white-space:nowrap;flex-shrink:0">'+c[1]+'</button>';
    }).join('')+'</div></div>'
    +'<div style="padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'
    +(filtMenu.length?grid:'<div style="grid-column:span 3;text-align:center;color:#ccc;padding:30px;font-size:14px">找不到商品</div>')
    +'</div>'
    +'<div style="background:#fff;border-top:2px solid #e0e0e0;padding:11px 14px">'
    +mBadge
    +'<div style="max-height:120px;overflow-y:auto;margin-bottom:8px">'+cartRows+'</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:8px">'
    +'<button onclick="setOtype(\'dine\')" style="flex:1;padding:8px;background:'+(S.otype==='dine'?'#6F4E37':'#f0f0f0')+';color:'+(S.otype==='dine'?'#fff':'#555')+';border:1px solid '+(S.otype==='dine'?'#6F4E37':'#ddd')+';border-radius:8px;font-size:13px">🪑 內用</button>'
    +'<button onclick="setOtype(\'takeout\')" style="flex:1;padding:8px;background:'+(S.otype==='takeout'?'#6F4E37':'#f0f0f0')+';color:'+(S.otype==='takeout'?'#fff':'#555')+';border:1px solid '+(S.otype==='takeout'?'#6F4E37':'#ddd')+';border-radius:8px;font-size:13px">📦 外帶</button>'
    +(S.otype==='dine'?'<input placeholder="桌號" value="'+S.table+'" onchange="S.table=this.value" style="flex:1;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px">':'')
    +'</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<button onclick="clearCart()" style="background:#f5f5f5;border:1px solid #ddd;color:#999;border-radius:9px;padding:12px 14px;font-size:16px">🗑</button>'
    +'<button onclick="S.view=\'member\';S.mPhone=\'\';render()" style="background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9;border-radius:9px;padding:12px 14px;font-size:14px">👤</button>'
    +'<div style="flex:1">'+(S.curMember&&mDiscAmt(cSub())>0?'<div style="font-size:11px;color:#43a047">折抵 -'+cur()+mDiscAmt(cSub())+'</div>':'')
    +'<div style="font-size:22px;font-weight:700;color:#6F4E37">'+cur()+G.grand+'</div></div>'
    +'<button onclick="goCheckout()" style="background:'+(count>0?'#6F4E37':'#ccc')+';color:#fff;border-radius:10px;padding:14px 18px;font-size:15px;font-weight:700">結帳</button>'
    +'</div></div></div>';
}

// ── CHECKOUT ────────────────────────────────────────────────────────────
function checkoutView(){
  var G=calcGrand(),cashN=parseInt(S.cashIn)||0;
  var cashErr=S.pay==='cash'&&S.cashIn&&cashN<G.grand;
  var canPay=S.pay!=='cash'||(S.cashIn&&!cashErr);
  var qAmts=quickAmts(G.grand);
  var displayText=S.cashIn?'NT$ '+parseInt(S.cashIn).toLocaleString():'NT$ 0';
  var changeText=S.cashIn?(cashN>=G.grand?'✓ 找零 NT$ '+(cashN-G.grand):'⚠ 差額 NT$ '+(G.grand-cashN)):'應付 NT$ '+G.grand;
  var changeCol=S.cashIn?(cashN>=G.grand?'#69F0AE':'#FF5252'):'#aaa';
  var numpad=S.pay==='cash'
    ?'<div style="margin-bottom:12px">'
      +'<div style="background:#1C1410;border-radius:12px;padding:16px;margin-bottom:9px">'
      +'<div style="font-size:12px;margin-bottom:6px;color:'+changeCol+';font-weight:600" id="np-change">'+changeText+'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:#555">收取金額</span><span style="font-size:30px;font-weight:700;color:#fff;letter-spacing:1px" id="np-display">'+displayText+'</span></div>'
      +'</div>'
      +'<div style="display:flex;gap:6px;margin-bottom:9px;overflow-x:auto">'
      +qAmts.map(function(a){var isExact=a===G.grand;return'<button onclick="numSet('+a+')" style="flex-shrink:0;padding:9px 14px;background:'+(isExact?'#6F4E37':'#fff')+';color:'+(isExact?'#fff':'#6F4E37')+';border:2px solid #6F4E37;border-radius:9px;font-size:14px;font-weight:700">'+(isExact?'✓ 剛好 ':'')+cur()+a+'</button>';}).join('')
      +'</div>'
      +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">'
      +[7,8,9,4,5,6,1,2,3].map(function(n){return'<button onclick="numKey('+n+')" style="padding:18px 0;background:#fff;border:1px solid #e0e0e0;border-radius:11px;font-size:22px;font-weight:700;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.08)">'+n+'</button>';}).join('')
      +'<button onclick="numKey(\'00\')" style="padding:18px 0;background:#fff;border:1px solid #e0e0e0;border-radius:11px;font-size:20px;font-weight:700;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.08)">00</button>'
      +'<button onclick="numKey(0)" style="padding:18px 0;background:#fff;border:1px solid #e0e0e0;border-radius:11px;font-size:22px;font-weight:700;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.08)">0</button>'
      +'<button onclick="numDel()" style="padding:18px 0;background:#fff;border:1px solid #e0e0e0;border-radius:11px;font-size:22px;color:#e53935;box-shadow:0 1px 3px rgba(0,0,0,.08)">⌫</button>'
      +'</div></div>'
    :'<div class="card" style="text-align:center;padding:24px;color:#888;font-size:15px;margin-bottom:12px">'+{card:'💳 信用卡刷卡',linepay:'📱 LINE Pay 掃碼'}[S.pay]+'</div>';
  return '<div style="padding:16px">'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px"><button onclick="S.view=\'pos\';render()" style="background:#6F4E37;color:#fff;border-radius:9px;padding:9px 16px;font-size:14px">← 返回</button><span style="font-size:16px;font-weight:700">💳 結帳</span></div>'
    +'<div class="card" style="margin-bottom:10px">'
    +Object.values(S.cart).map(function(i){return'<div style="display:flex;justify-content:space-between;font-size:13px;padding:3px 0"><span>'+i.ic+' '+i.name+' ×'+i.qty+'</span><span style="color:#6F4E37;font-weight:600">'+cur()+i.price*i.qty+'</span></div>'}).join('')
    +'<div style="border-top:1px solid #f0f0f0;margin-top:7px;padding-top:7px">'
    +(G.mDisc>0?'<div style="display:flex;justify-content:space-between;font-size:13px;color:#43a047"><span>會員折扣</span><span>−'+cur()+G.mDisc+'</span></div>':'')

function numKey(k){var s=S.cashIn||'';if(k==='00')s=s?s+'00':'';else if(s==='0')s=String(k);else s=s+String(k);if(s.length>8)return;S.cashIn=s;updateNP();}

function updateNP(){
  var G=calcGrand(),cashN=parseInt(S.cashIn)||0;
  var disp=document.getElementById('np-display'),chng=document.getElementById('np-change'),ok=document.getElementById('checkout-ok');
  if(disp)disp.textContent=S.cashIn?'NT$ '+cashN.toLocaleString():'NT$ 0';

}

function doCheckout(){
  var G=calcGrand();var cashN=parseInt(S.cashIn)||0;
  if(S.pay==='cash'&&S.cashIn&&cashN<G.grand){toast('金額不足','#e53935');return;}
  var no=p3(S.no++);var pointsEarned=Math.floor(G.after/10);
  var memSnap=S.curMember?{phone:S.curMember.phone,name:S.curMember.name,spend:S.curMember.spend,points:S.curMember.points}:null;
  if(S.curMember){S.curMember.spend+=G.grand;S.curMember.points+=pointsEarned;}
  var order={id:Date.now(),no:no,items:Object.values(S.cart).map(function(i){return Object.assign({},i)}),total:G.grand,sub:G.sub,mDisc:G.mDisc,manDisc:G.manDisc,tax:G.tax,type:S.otype,table:S.otype==='dine'?(S.table||'—'):'外帶',payment:S.pay,change:S.pay==='cash'&&S.cashIn?cashN-G.grand:null,carrier:S.carrier,staffName:S.curStaff?S.curStaff.name:'',member:memSnap,pointsEarned:pointsEarned,date:tod(),time:tnow(),status:'pending'};
  order.items.forEach(function(item){var v=invOf(item.id);if(!v.unlimited)v.stock=Math.max(0,v.stock-item.qty);});
  S.orders.unshift(order);S.curOrder=order;S.cart={};S.discount=0;S.carrier='';S.curMember=null;
  persist();S.curTab='receipt';S.view='print';render();
  toast('✓ 訂單 #'+no+(pointsEarned?' ｜ +'+pointsEarned+' 點':''));
}
function selectMember(phone){S.curMember=findMember(phone);S.view='pos';render();if(S.curMember)toast('已套用：'+S.curMember.name);}
function addNewMember(){var name=(document.getElementById('m-name')||{}).value||'';var phone=S.mPhone;if(!name||phone.length<10){toast('請填寫姓名和手機號碼','#e53935');return;}if(findMember(phone)){toast('此電話已是會員','#e53935');return;}var m={id:'M'+Date.now(),phone:phone,name:name,spend:0,points:0,join:tod()};S.members.push(m);persist();S.curMember=m;S.view='pos';render();toast('✓ 新增會員：'+name);}
function updSt(id,s){var o=S.orders.find(function(x){return x.id===id});if(o){o.status=s;persist();render();}}
function pvOrd(id,tab){var o=S.orders.find(function(x){return x.id===id});if(o){S.curOrder=o;S.curTab=tab;S.view='print';render();}}
function pinKey(k){if(S.pinBuf.length>=4)return;S.pinBuf+=String(k);S.pinErr=false;if(S.pinBuf.length===4){if(S.pinBuf===S.cfg.pin){S.pinOk=true;S.view='admin';render();}else{S.pinErr=true;S.pinBuf='';render();}}else render();}
function pinDel(){if(S.pinBuf.length>0){S.pinBuf=S.pinBuf.slice(0,-1);render();}}
function toggleItem(id){var m=S.menu.find(function(x){return x.id===id});if(m){m.active=!m.active;persist();render();}}
function delItem(id){if(!confirm('確定刪除此商品？'))return;S.menu=S.menu.filter(function(m){return m.id!==id});delete S.inv[id];persist();render();}
function toggleInv(id){var v=invOf(id);v.unlimited=!v.unlimited;persist();render();}
function adjInv(id,d){var v=invOf(id);v.stock=Math.max(0,v.stock+d);persist();render();}
function doRestock(id){var inp=document.getElementById('rs-qty');var qty=parseInt(inp?inp.value:0)||0;if(!qty){toast('請輸入數量','#e53935');return;}var v=invOf(id);v.stock+=qty;v.unlimited=false;S.restockId=null;persist();render();toast('✓ 已補貨 '+qty+' 份');}
function addStaff(){var inp=document.getElementById('new-staff');var name=inp?inp.value.trim():'';if(!name){toast('請輸入員工姓名','#e53935');return;}S.staff.push({id:'S'+Date.now(),name:name});persist();render();toast('✓ 員工已新增');}
function delStaff(id){if(S.staff.length<=1){toast('至少保留一名員工','#e53935');return;}if(!confirm('確定刪除此員工？'))return;S.staff=S.staff.filter(function(s){return s.id!==id});if(S.curStaff&&S.curStaff.id===id)S.curStaff=S.staff[0];persist();render();}
function saveCfg(){var pin=(document.getElementById('cfg-pin')||{}).value||'';if(pin&&pin.length!==4){toast('PIN 碼須為 4 位數字','#e53935');return;}S.cfg.shop=(document.getElementById('cfg-shop')||{}).value||'BREW CAFÉ';S.cfg.cur=(document.getElementById('cfg-cur')||{}).value||'NT$';S.cfg.tax=parseFloat((document.getElementById('cfg-tax')||{}).value)||0;S.cfg.note=(document.getElementById('cfg-note')||{}).value||'';if(pin)S.cfg.pin=pin;persist();render();toast('✓ 設定已儲存');}
function clearOrders(){if(!confirm('確定清除所有訂單？此操作無法復原！'))return;S.orders=[];S.no=1;persist();render();toast('訂單資料已清除');}
function expCSV(){var rows=['訂單,日期,時間,類型,桌號,付款,小計,折扣,合計,狀態,服務人員,會員'];S.orders.forEach(function(o){rows.push([o.no,o.date,o.time,o.type==='dine'?'內用':'外帶',o.table,PAYLB[o.payment]||o.payment,o.sub||o.total,(o.mDisc||0)+(o.manDisc||0),o.total,STMAP[o.status]?STMAP[o.status].lb:o.status,o.staffName||'',o.member?o.member.name:''].join(','));});var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.join('\n'));a.download=S.cfg.shop+'_訂單記錄.csv';a.click();toast('✓ CSV 已匯出');}

render();
</script>
</body>
</html>
