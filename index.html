
<style>

</style>
<div id="R" style="min-height:600px;background:#f5f5f5;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid #ddd"></div>
<script>
var DMENU=[
  {id:'A1',name:'美式咖啡',p:90,cat:'drinks',ic:'☕',on:true},
  {id:'A2',name:'拿鐵',p:115,cat:'drinks',ic:'🥛',on:true},
  {id:'A3',name:'卡布奇諾',p:120,cat:'drinks',ic:'☕',on:true},
  {id:'A4',name:'摩卡',p:135,cat:'drinks',ic:'🍫',on:true},
  {id:'A5',name:'抹茶拿鐵',p:130,cat:'drinks',ic:'🍵',on:true},
  {id:'A6',name:'焦糖瑪奇朵',p:140,cat:'drinks',ic:'🍮',on:true},
  {id:'A7',name:'紅茶',p:70,cat:'drinks',ic:'🫖',on:true},
  {id:'B1',name:'法式吐司',p:155,cat:'food',ic:'🍞',on:true},
  {id:'B2',name:'凱薩沙拉',p:185,cat:'food',ic:'🥗',on:true},
  {id:'B3',name:'帕尼尼',p:200,cat:'food',ic:'🥪',on:true},
  {id:'B4',name:'早午餐',p:285,cat:'food',ic:'🍳',on:true},
  {id:'C1',name:'提拉米蘇',p:125,cat:'dessert',ic:'🍰',on:true},
  {id:'C2',name:'起司蛋糕',p:135,cat:'dessert',ic:'🎂',on:true},
  {id:'C3',name:'奶油可頌',p:68,cat:'dessert',ic:'🥐',on:true},
  {id:'C4',name:'馬卡龍3入',p:115,cat:'dessert',ic:'🍬',on:true}
];
var ICONS=['☕','🥛','🍫','🍵','🍮','🍨','🫖','🍞','🥗','🥪','🍳','🍰','🎂','🥐','🍬','🧁'];
var BG={drinks:'#FFF3E0',food:'#FFF8E1',dessert:'#EDE7F6'};
var STMAP={pending:{lb:'待處理',bg:'#FFF3E0',col:'#BF360C'},making:{lb:'製作中',bg:'#E3F2FD',col:'#1565C0'},done:{lb:'已完成',bg:'#E8F5E9',col:'#2E7D32'},cancelled:{lb:'已取消',bg:'#f5f5f5',col:'#999'}};
var PAYLB={cash:'現金',card:'信用卡',linepay:'LINE Pay'};

var S={
  v:'pos',sub:'menu',cat:'all',otype:'dine',table:'',pay:'cash',cin:'',
  cart:{},order:null,tab:'receipt',orders:[],no:1,
  menu:null,inv:{},members:[],member:null,
  disc:0,search:'',openCash:0,mPhone:'',
  pinOk:false,pinBuf:'',pinErr:false,addForm:false,editId:null,
  memberDetail:null,  // 正在查看的會員
  salesDateFilter:'all',  // 銷售日期篩選
  pin:'1234',shop:'BREW CAFÉ',cur:'NT$',tax:0,note:'感謝光臨，歡迎再來！'
};

(function(){
  try{
    var m=localStorage.getItem('p_m'),o=localStorage.getItem('p_o'),n=localStorage.getItem('p_n'),
        v=localStorage.getItem('p_v'),c=localStorage.getItem('p_c'),mb=localStorage.getItem('p_mb');
    S.menu=m?JSON.parse(m):JSON.parse(JSON.stringify(DMENU));
    if(o)S.orders=JSON.parse(o);if(n)S.no=+n;if(v)S.inv=JSON.parse(v);if(mb)S.members=JSON.parse(mb);
    if(c){var cfg=JSON.parse(c);S.pin=cfg.pin||'1234';S.shop=cfg.shop||'BREW CAFÉ';S.cur=cfg.cur||'NT$';S.tax=cfg.tax||0;S.note=cfg.note||'';}
  }catch(e){S.menu=JSON.parse(JSON.stringify(DMENU));}
  S.menu.forEach(function(m){if(!S.inv[m.id])S.inv[m.id]={stock:50,unlimited:true,minAlert:5};});
  // 模擬測試資料
  if(!S.orders.length&&!S.members.length){
    S.members=[
      {id:'M1',phone:'0912345678',name:'陳小明',spend:3850,points:385},
      {id:'M2',phone:'0923456789',name:'林小花',spend:12500,points:1250},
      {id:'M3',phone:'0934567890',name:'王大衛',spend:680,points:68}
    ];
    var now=new Date();
    var base=now.getTime()-86400000*30;
    var sampleItems=[[{id:'A1',name:'美式咖啡',p:90,ic:'☕',qty:2},{id:'C3',name:'奶油可頌',p:68,ic:'🥐',qty:1}],[{id:'A2',name:'拿鐵',p:115,ic:'🥛',qty:1},{id:'A5',name:'抹茶拿鐵',p:130,ic:'🍵',qty:1}],[{id:'B4',name:'早午餐',p:285,ic:'🍳',qty:1},{id:'A2',name:'拿鐵',p:115,ic:'🥛',qty:1}],[{id:'A1',name:'美式咖啡',p:90,ic:'☕',qty:3}],[{id:'C1',name:'提拉米蘇',p:125,ic:'🍰',qty:2},{id:'A2',name:'拿鐵',p:115,ic:'🥛',qty:2}],[{id:'A6',name:'焦糖瑪奇朵',p:140,ic:'🍮',qty:1},{id:'B1',name:'法式吐司',p:155,ic:'🍞',qty:1}],[{id:'A3',name:'卡布奇諾',p:120,ic:'☕',qty:2}],[{id:'A1',name:'美式咖啡',p:90,ic:'☕',qty:1},{id:'A2',name:'拿鐵',p:115,ic:'🥛',qty:1},{id:'C3',name:'奶油可頌',p:68,ic:'🥐',qty:2}]];
    var mems=[S.members[0],null,S.members[1],null,S.members[0],S.members[2],null,S.members[1]];
    var pays=['cash','card','cash','linepay','cash','card','cash','linepay'];
    for(var i=0;i<8;i++){
      var d=new Date(base+Math.floor(Math.random()*86400000*30));
      var items=sampleItems[i];
      var total=items.reduce(function(s,x){return s+x.p*x.qty},0);
      var mem=mems[i];
      S.orders.push({id:base+i,no:p3(i+1),items:items,total:total,type:i%2===0?'dine':'takeout',table:String(i+1),payment:pays[i],change:pays[i]==='cash'?Math.ceil(total/100)*100-total:null,member:mem?{name:mem.name,phone:mem.phone,spend:mem.spend}:null,date:d.toLocaleDateString('zh-TW'),time:d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),status:'done'});
    }
    save();
  }
})();

function save(){try{localStorage.setItem('p_m',JSON.stringify(S.menu));localStorage.setItem('p_o',JSON.stringify(S.orders));localStorage.setItem('p_n',S.no);localStorage.setItem('p_v',JSON.stringify(S.inv));localStorage.setItem('p_mb',JSON.stringify(S.members));localStorage.setItem('p_c',JSON.stringify({pin:S.pin,shop:S.shop,cur:S.cur,tax:S.tax,note:S.note}));}catch(e){}}
function tod(){return new Date().toLocaleDateString('zh-TW')}
function tnow(){return new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
function p3(n){return String(n).padStart(3,'0')}
function cu(){return S.cur}
function csub(){return Object.values(S.cart).reduce(function(s,i){return s+i.p*i.qty},0)}
function ccnt(){return Object.values(S.cart).reduce(function(s,i){return s+i.qty},0)}
function grand(){var s=csub(),a=Math.max(0,s-(parseInt(S.disc)||0));return a+Math.round(a*S.tax/100)}
function todO(){return S.orders.filter(function(o){return o.date===tod()})}
function mLv(sp){
  if(sp>=30000)return{lb:'⭐ VIP',col:'#B45309',bg:'#FEF3C7',disc:10};
  if(sp>=10000)return{lb:'🥇 金卡',col:'#D97706',bg:'#FFFBEB',disc:5};
  if(sp>=3000)return{lb:'🥈 銀卡',col:'#6B7280',bg:'#F3F4F6',disc:3};
  return{lb:'👤 一般',col:'#9CA3AF',bg:'#F9FAFB',disc:0};
}
function qAmts(g){var s=new Set([g]);[Math.ceil(g/50)*50,Math.ceil(g/100)*100,Math.ceil(g/500)*500,Math.ceil(g/1000)*1000].forEach(function(a){if(a>g&&a<=5000)s.add(a);});return Array.from(s).sort(function(a,b){return a-b}).slice(0,5);}
function toast(msg,col){col=col||'#4CAF50';var t=document.createElement('div');t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:'+col+';color:#fff;padding:10px 20px;border-radius:9px;font-size:14px;font-weight:600;z-index:9999;white-space:nowrap;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.25)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2500);}

function re(){
  var R=document.getElementById('R');if(!R)return;R.innerHTML='';
  var nav=document.createElement('div');
  nav.style.cssText='background:#6F4E37;padding:10px 13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0';
  var toOrd=todO().length;
  nav.innerHTML='<span style="color:#fff;font-size:14px;font-weight:700;margin-right:4px">☕ '+S.shop+'</span>'
    +[['pos','🧾收銀'],['orders','📋訂單'+(toOrd?'('+toOrd+')':'')],['pin','⚙️後台']].map(function(v){
      var on=(v[0]==='pos'&&['pos','checkout','print','member'].indexOf(S.v)>=0)||(v[0]==='orders'&&S.v==='orders')||(v[0]==='pin'&&['pin','admin'].indexOf(S.v)>=0);
      return'<button onclick="nav(\''+v[0]+'\')" style="background:'+(on?'rgba(255,255,255,.3)':'transparent')+';color:'+(on?'#fff':'rgba(255,255,255,.7)')+';padding:5px 10px;border-radius:20px;font-size:12px">'+v[1]+'</button>';
    }).join('');
  R.appendChild(nav);
  var cnt=document.createElement('div');cnt.style.cssText='flex:1;overflow-y:auto';R.appendChild(cnt);
  var fn={pos:rPos,checkout:rChk,print:rPrt,orders:rOrd,member:rMbr,pin:rPin,admin:rAdm};
  if(fn[S.v])fn[S.v](cnt);
}
function nav(v){if(v==='pin'){if(S.pinOk){S.v='admin';re();}else{S.v='pin';S.pinBuf='';S.pinErr=false;re();}}else{S.v=v;re();}}

// ── POS ──────────────────────────────────────────────────────────────
function rPos(c){
  var G=grand(),count=ccnt();
  var filt=S.menu.filter(function(m){return m.on&&(S.cat==='all'||m.cat===S.cat)&&(!S.search||m.name.indexOf(S.search)>=0);});
  var h='<div style="background:#fff;border-bottom:1px solid #e0e0e0;padding:7px 10px"><input placeholder="🔍 搜尋商品" value="'+S.search+'" oninput="S.search=this.value;re()" style="width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:6px"><div style="display:flex;gap:5px;overflow-x:auto">';
  [['全部','all'],['☕飲料','drinks'],['🍽餐點','food'],['🍰甜點','dessert']].forEach(function(x){h+='<button onclick="S.cat=\''+x[1]+'\';re()" style="padding:5px 12px;background:'+(S.cat===x[1]?'#6F4E37':'#f0f0f0')+';color:'+(S.cat===x[1]?'#fff':'#555')+';border:none;border-radius:20px;font-size:12px;white-space:nowrap;flex-shrink:0">'+x[0]+'</button>';});
  h+='</div></div><div style="padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px">';
  filt.forEach(function(item){h+='<button onclick="addI(\''+item.id+'\',\''+item.name+'\','+item.p+',\''+item.ic+'\')" style="background:'+(BG[item.cat]||'#f9f9f9')+';border:1px solid #ddd;border-radius:10px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;gap:3px"><span style="font-size:22px">'+item.ic+'</span><span style="font-size:11px;font-weight:600;color:#333;text-align:center;line-height:1.3">'+item.name+'</span><span style="font-size:12px;color:#6F4E37;font-weight:700">'+cu()+item.p+'</span></button>';});
  h+='</div><div style="background:#fff;border-top:2px solid #e0e0e0;padding:10px 12px">';
  if(S.member){var lv=mLv(S.member.spend);h+='<div style="background:'+lv.bg+';border:1px solid '+lv.col+';border-radius:7px;padding:5px 10px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px"><span class="tag" style="background:'+lv.col+';color:#fff">'+lv.lb+'</span> '+S.member.name+'</span><button onclick="S.member=null;re()" style="background:transparent;color:#aaa;font-size:15px;padding:0 4px">✕</button></div>';}
  h+='<div style="max-height:100px;overflow-y:auto;margin-bottom:7px">';
  var items=Object.values(S.cart);
  if(!items.length)h+='<div style="text-align:center;color:#ccc;padding:12px 0;font-size:12px">🛒 尚未選購</div>';
  else items.forEach(function(i){h+='<div style="display:flex;align-items:center;gap:5px;padding:4px 0;border-bottom:1px solid #f5f5f5"><span style="font-size:16px">'+i.ic+'</span><span style="flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+i.name+'</span><button onclick="adjI(\''+i.id+'\',-1)" style="background:#f0f0f0;border:1px solid #ddd;border-radius:5px;width:23px;height:23px;font-size:14px;line-height:1">−</button><span style="font-size:13px;width:18px;text-align:center;font-weight:600">'+i.qty+'</span><button onclick="adjI(\''+i.id+'\',1)" style="background:#6F4E37;color:#fff;border-radius:5px;width:23px;height:23px;font-size:14px;line-height:1">+</button><span style="font-size:11px;color:#6F4E37;font-weight:700;width:48px;text-align:right">'+cu()+i.p*i.qty+'</span></div>';});
  h+='</div><div style="display:flex;gap:5px;margin-bottom:7px">';
  [['dine','🪑 內用'],['takeout','📦 外帶']].forEach(function(t){var on=S.otype===t[0];h+='<button onclick="S.otype=\''+t[0]+'\';re()" style="flex:1;padding:6px;background:'+(on?'#6F4E37':'#f0f0f0')+';color:'+(on?'#fff':'#555')+';border:1px solid '+(on?'#6F4E37':'#ddd')+';border-radius:7px;font-size:12px">'+t[1]+'</button>';});
  if(S.otype==='dine')h+='<input placeholder="桌號" value="'+S.table+'" onchange="S.table=this.value" style="flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:7px;font-size:12px">';
  h+='</div><div style="display:flex;align-items:center;gap:7px"><button onclick="S.cart={};re()" style="background:#f5f5f5;border:1px solid #ddd;color:#999;border-radius:8px;padding:10px 12px;font-size:15px">🗑</button><button onclick="S.v=\'member\';S.mPhone=\'\';re()" style="background:#E3F2FD;color:#1565C0;border:1px solid #90CAF9;border-radius:8px;padding:10px 12px;font-size:13px">👤</button><div style="flex:1"><div style="font-size:21px;font-weight:700;color:#6F4E37">'+cu()+G+'</div></div><button onclick="goCh()" style="background:'+(count>0?'#6F4E37':'#ccc')+';color:#fff;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700">結帳</button></div></div>';
  c.innerHTML=h;
}
function addI(id,name,p,ic){if(S.cart[id])S.cart[id].qty++;else S.cart[id]={id:id,name:name,p:p,ic:ic,qty:1};re();}
function adjI(id,d){if(!S.cart[id])return;S.cart[id].qty+=d;if(S.cart[id].qty<=0)delete S.cart[id];re();}
function goCh(){if(ccnt()>0){S.v='checkout';S.pay='cash';S.cin='';re();}}

// ── CHECKOUT ─────────────────────────────────────────────────────────
function rChk(c){
  var G=grand(),cashN=parseInt(S.cin)||0;
  var canPay=S.pay!=='cash'||(S.cin&&cashN>=G);
  var chgTxt=S.cin?(cashN>=G?'✓ 找零 NT$ '+(cashN-G):'⚠ 差額 NT$ '+(G-cashN)):'應付 '+cu()+G;
  var chgCol=S.cin?(cashN>=G?'#69F0AE':'#FF5252'):'#aaa';
  var h='<div style="padding:14px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><button onclick="S.v=\'pos\';re()" style="background:#6F4E37;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px">← 返回</button><span style="font-size:15px;font-weight:700">💳 結帳</span></div>';
  h+='<div class="card" style="margin-bottom:10px">'+Object.values(S.cart).map(function(i){return'<div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0"><span>'+i.ic+' '+i.name+' ×'+i.qty+'</span><span style="color:#6F4E37;font-weight:600">'+cu()+i.p*i.qty+'</span></div>';}).join('')+'<div style="border-top:1px solid #f0f0f0;margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:15px"><span>應付</span><span style="color:#6F4E37">'+cu()+G+'</span></div></div>';
  if(S.member){var lv=mLv(S.member.spend);h+='<div style="background:'+lv.bg+';border:1px solid '+lv.col+';border-radius:8px;padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px"><span class="tag" style="background:'+lv.col+';color:#fff">'+lv.lb+'</span><span style="font-size:12px">'+S.member.name+'</span><span style="margin-left:auto;color:#43a047;font-weight:700">-'+lv.disc+'%</span></div>';}
  h+='<div style="display:flex;gap:5px;margin-bottom:10px">'+[['cash','💵 現金'],['card','💳 信用卡'],['linepay','📱 LINE Pay']].map(function(p){var on=S.pay===p[0];return'<button onclick="S.pay=\''+p[0]+'\';S.cin=\'\';re()" style="flex:1;padding:9px 0;background:'+(on?'#6F4E37':'#f5f5f5')+';color:'+(on?'#fff':'#555')+';border:1px solid '+(on?'#6F4E37':'#ddd')+';border-radius:8px;font-size:12px;font-weight:'+(on?700:400)+'">'+p[1]+'</button>';}).join('')+'</div>';
  if(S.pay==='cash'){
    h+='<div style="margin-bottom:10px"><div style="background:#1C1410;border-radius:12px;padding:14px;margin-bottom:8px"><div id="np-chg" style="font-size:11px;color:'+chgCol+';font-weight:600;margin-bottom:5px">'+chgTxt+'</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;color:#666">收取金額</span><span id="np-disp" style="font-size:26px;font-weight:700;color:#fff">'+(S.cin?'NT$ '+cashN.toLocaleString():'NT$ 0')+'</span></div></div>';
    h+='<div style="display:flex;gap:5px;margin-bottom:8px;overflow-x:auto">'+qAmts(G).map(function(a){var e=a===G;return'<button onclick="nSet('+a+')" style="flex-shrink:0;padding:7px 12px;background:'+(e?'#6F4E37':'#fff')+';color:'+(e?'#fff':'#6F4E37')+';border:2px solid #6F4E37;border-radius:8px;font-size:13px;font-weight:700">'+(e?'✓ ':'')+cu()+a+'</button>';}).join('')+'</div>';
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">'+[7,8,9,4,5,6,1,2,3].map(function(n){return'<button onclick="nKey('+n+',false)" style="padding:16px 0;background:#fff;border:1px solid #e0e0e0;border-radius:10px;font-size:20px;font-weight:700;color:#333">'+n+'</button>';}).join('')+'<button onclick="nKey(0,true)" style="padding:16px 0;background:#fff;border:1px solid #e0e0e0;border-radius:10px;font-size:18px;font-weight:700;color:#333">00</button><button onclick="nKey(0,false)" style="padding:16px 0;background:#fff;border:1px solid #e0e0e0;border-radius:10px;font-size:20px;font-weight:700;color:#333">0</button><button onclick="nDel()" style="padding:16px 0;background:#fff;border:1px solid #e0e0e0;border-radius:10px;font-size:20px;color:#e53935">⌫</button></div></div>';
  }else h+='<div class="card" style="text-align:center;padding:20px;color:#888;font-size:14px;margin-bottom:10px">'+(S.pay==='card'?'💳 信用卡刷卡':'📱 LINE Pay 掃碼')+'</div>';
  h+='<button id="ok-btn" onclick="doPay()" style="width:100%;padding:15px;background:'+(canPay?'#6F4E37':'#ccc')+';color:#fff;border-radius:10px;font-size:15px;font-weight:700">✓ 確認收款 '+cu()+G+'</button></div>';
  c.innerHTML=h;
}
function nKey(n,dz){var s=S.cin||'';if(dz){s=s?s+'00':'';}else if(s==='0'){s=String(n);}else{s=s+String(n);}if(s.length>7)return;S.cin=s;npUp();}
function nDel(){S.cin=(S.cin||'').slice(0,-1);npUp();}
function nSet(v){S.cin=String(v);npUp();}
function npUp(){var G=grand(),cashN=parseInt(S.cin)||0;var d=document.getElementById('np-disp'),ch=document.getElementById('np-chg'),ok=document.getElementById('ok-btn');if(d)d.textContent=S.cin?'NT$ '+cashN.toLocaleString():'NT$ 0';if(ch){if(S.cin&&cashN>=G){ch.textContent='✓ 找零 NT$ '+(cashN-G);ch.style.color='#69F0AE';}else if(S.cin&&cashN<G){ch.textContent='⚠ 差額 NT$ '+(G-cashN);ch.style.color='#FF5252';}else{ch.textContent='應付 NT$ '+G;ch.style.color='#aaa';}}if(ok)ok.style.background=S.cin&&cashN>=G?'#6F4E37':'#ccc';}
function doPay(){

// ── ✅ 商品銷售紀錄 ───────────────────────────────────────────────────
function adminSalesHTML(){
  // 日期篩選
  var allDates=[];
  S.orders.forEach(function(o){if(allDates.indexOf(o.date)<0)allDates.push(o.date);});
  allDates.sort().reverse();

  var filtOrders=S.orders.filter(function(o){
    if(o.status==='cancelled')return false;
    if(S.salesDateFilter==='all')return true;
    if(S.salesDateFilter==='today')return o.date===tod();
    if(S.salesDateFilter==='week'){
      var d=new Date(),w=new Date(d);w.setDate(d.getDate()-7);
      var od=new Date(o.date.replace(/\//g,'-'));
      return od>=w&&od<=d;
    }
    return o.date===S.salesDateFilter;
  });

  // 彙總商品銷售
  var salesMap={};
  filtOrders.forEach(function(o){
    o.items.forEach(function(item){
      if(!salesMap[item.name]){salesMap[item.name]={name:item.name,ic:item.ic,qty:0,rev:0,orders:0};}
      salesMap[item.name].qty+=item.qty;
      salesMap[item.name].rev+=item.p*item.qty;
      salesMap[item.name].orders++;
    });
  });
  var sorted=Object.values(salesMap).sort(function(a,b){return b.rev-a.rev});
  var totalRev=sorted.reduce(function(s,x){return s+x.rev},0);
  var totalQty=sorted.reduce(function(s,x){return s+x.qty},0);
  var totalOrderCount=filtOrders.length;

  // 付款分析
  var payMap={cash:0,card:0,linepay:0};
  filtOrders.forEach(function(o){payMap[o.payment]=(payMap[o.payment]||0)+o.total;});

  var h='';
  // 日期篩選 tabs
  h+='<div style="display:flex;gap:5px;overflow-x:auto;margin-bottom:12px">';
  [['all','全部'],['today','今日'],['week','近7天']].forEach(function(f){var on=S.salesDateFilter===f[0];h+='<button onclick="S.salesDateFilter=\''+f[0]+'\';re()" style="flex-shrink:0;padding:6px 13px;background:'+(on?'#6F4E37':'#fff')+';color:'+(on?'#fff':'#555')+';border:1px solid '+(on?'#6F4E37':'#ddd')+';border-radius:20px;font-size:12px">'+f[1]+'</button>';});
  h+='</div>';

  // 總覽卡片
  h+='<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:13px">';
  h+='<div class="card" style="text-align:center"><div style="font-size:10px;color:#aaa">📋 訂單數</div><div style="font-size:20px;font-weight:700;color:#6F4E37">'+totalOrderCount+'</div></div>';
  h+='<div class="card" style="text-align:center"><div style="font-size:10px;color:#aaa">💰 銷售總額</div><div style="font-size:17px;font-weight:700;color:#6F4E37">'+cu()+totalRev.toLocaleString()+'</div></div>';
  h+='<div class="card" style="text-align:center"><div style="font-size:10px;color:#aaa">🛒 商品總件數</div><div style="font-size:20px;font-weight:700;color:#1565C0">'+totalQty+'</div></div>';
  h+='<div class="card" style="text-align:center"><div style="font-size:10px;color:#aaa">🧾 平均客單</div><div style="font-size:17px;font-weight:700;color:#388E3C">'+cu()+(totalOrderCount?Math.round(totalRev/totalOrderCount):0)+'</div></div>';
  h+='</div>';

  // 付款分析
  if(totalRev>0){
    h+='<div class="card" style="margin-bottom:13px"><div style="font-size:12px;font-weight:600;margin-bottom:8px">付款方式分析</div>';
    [['💵 現金','cash'],['💳 信用卡','card'],['📱 LINE Pay','linepay']].forEach(function(p){
      var amt=payMap[p[1]]||0;var pct=totalRev?Math.round(amt/totalRev*100):0;
      h+='<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+p[0]+'</span><span style="color:#6F4E37;font-weight:600">'+cu()+amt+' ('+pct+'%)</span></div><div style="height:5px;background:#f0f0f0;border-radius:3px"><div style="height:100%;background:#6F4E37;border-radius:3px;width:'+pct+'%"></div></div></div>';
    });
    h+='</div>';
  }

  // 商品銷售排行
  h+='<div style="font-size:13px;font-weight:600;color:#555;margin-bottom:8px">商品銷售排行（共 '+sorted.length+' 種）</div>';
  if(!sorted.length){
    h+='<div style="text-align:center;color:#ccc;padding:30px;font-size:13px">📊<br><br>此期間暫無銷售紀錄</div>';
  }else{
    sorted.forEach(function(item,idx){
      var pct=totalRev?Math.round(item.rev/totalRev*100):0;
      var rankCol=idx===0?'#FFD700':idx===1?'#C0C0C0':idx===2?'#CD7F32':'#e0e0e0';
      var rankTxt=idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1);
      h+='<div class="card" style="padding:10px 13px;margin-bottom:7px">'
        +'<div style="display:flex;align-items:center;gap:9px">'
        +'<div style="width:28px;height:28px;border-radius:50%;background:'+(idx<3?rankCol:'#f0f0f0')+';display:flex;align-items:center;justify-content:center;font-size:'+(idx<3?'16px':'11px')+';font-weight:700;flex-shrink:0;color:'+(idx<3?'#fff':'#999')+'">'+(idx<3?rankTxt:rankTxt)+'</div>'
        +'<span style="font-size:20px">'+item.ic+'</span>'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:13px;font-weight:600">'+item.name+'</div>'
        +'<div style="font-size:11px;color:#aaa">售出 '+item.qty+' 份</div>'
        +'</div>'
        +'<div style="text-align:right">'
        +'<div style="font-size:14px;font-weight:700;color:#6F4E37">'+cu()+item.rev.toLocaleString()+'</div>'
        +'<div style="font-size:10px;color:#aaa">佔 '+pct+'%</div>'
        +'</div></div>'
        // 比例條
        +'<div style="margin-top:8px"><div style="height:4px;background:#f0f0f0;border-radius:2px"><div style="height:100%;background:'+(idx===0?'#FFD700':idx===1?'#C0C0C0':idx===2?'#CD7F32':'#6F4E37')+';border-radius:2px;width:'+pct+'%"></div></div></div>'
        +'</div>';
    });
  }
  return h;
}

function picI(pfx,ic){document.querySelectorAll('[id^="'+pfx+'__"]').forEach(function(b){b.style.background='#f9f9f9';b.style.borderColor='#eee';});var b=document.getElementById(pfx+'__'+ic);if(b){b.style.background='#FFF3E0';b.style.borderColor='#6F4E37';}var inp=document.getElementById(pfx+'iv');if(inp)inp.value=ic;}
function seAdd(){var n=(document.getElementById('nwn')||{}).value||'',p=parseInt((document.getElementById('nwp')||{}).value)||0,cat=(document.getElementById('nwc')||{}).value||'drinks',ic=(document.getElementById('nwiv')||{}).value||'☕';if(!n||!p){toast('請填寫名稱和售價','#e53935');return;}var nid='U'+Date.now();S.menu.push({id:nid,name:n,p:p,cat:cat,ic:ic,on:true});S.inv[nid]={stock:50,unlimited:false,minAlert:5};S.addForm=false;save();re();toast('✓ 商品已新增');}
function seEdit(){var id=S.editId;if(!id)return;var n=(document.getElementById('edn')||{}).value||'',p=parseInt((document.getElementById('edp')||{}).value)||0,cat=(document.getElementById('edc')||{}).value||'drinks',ic=(document.getElementById('ediv')||{}).value||'☕';if(!n||!p){toast('請填寫名稱和售價','#e53935');return;}var item=S.menu.find(function(m){return m.id===id});if(item){item.name=n;item.p=p;item.cat=cat;item.ic=ic;}S.editId=null;save();re();toast('✓ 商品已更新');}
function togI(id){var m=S.menu.find(function(x){return x.id===id});if(m){m.on=!m.on;save();re();}}
function delI(id){if(!confirm('確定刪除？'))return;S.menu=S.menu.filter(function(m){return m.id!==id});delete S.inv[id];save();re();}
function doClose(){var valid=todO().filter(function(o){return o.status!=='cancelled'});var rev=valid.reduce(function(s,o){return s+o.total},0);var cashS=valid.filter(function(o){return o.payment==='cash'}).reduce(function(s,o){return s+o.total},0);toast('✅ 關帳完成！營收 '+cu()+rev.toLocaleString()+' · 現金 '+cu()+((parseInt(S.openCash)||0)+cashS).toLocaleString());}
function saveCfg(){var pin=(document.getElementById('pn')||{}).value||'';if(pin&&pin.length!==4){toast('PIN須為4位','#e53935');return;}S.shop=(document.getElementById('sh')||{}).value||'BREW CAFÉ';S.cur=(document.getElementById('cr')||{}).value||'NT$';S.tax=parseFloat((document.getElementById('tx')||{}).value)||0;S.note=(document.getElementById('nt')||{}).value||'';if(pin)S.pin=pin;save();re();toast('✓ 設定已儲存');}
function clearO(){if(!confirm('確定清除所有訂單？'))return;S.orders=[];S.no=1;save();re();toast('已清除');}

re();
</script>
